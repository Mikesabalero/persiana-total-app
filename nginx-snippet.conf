# ============================================================
# INSTRUCCIONES DE CONFIGURACIÓN EN EL SERVIDOR
# ============================================================
# Aplicar después de hacer git pull y de iniciar proxy.js
#
# PASO 1: Agregar este bloque `location /api/` dentro del server {}
#         que ya sirve la app en el puerto 3000.
#
# Editar: /etc/nginx/conf.d/<tu-config>.conf  (o donde esté)
#
# Buscar el bloque:   server { listen 3000; ... }
# Agregar adentro:

    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

# ============================================================
# PASO 2: Reiniciar nginx
# ============================================================
#
#   nginx -t && nginx -s reload
#
# ============================================================
# PASO 3: Restringir NocoDB a solo localhost
# ============================================================
#
# Opción A — Si usás docker-compose, cambiar el puerto de NocoDB:
#
#   ports:
#     - "127.0.0.1:32770:8080"   # antes era "32770:8080"
#
#   Luego: docker-compose up -d
#
# Opción B — Firewall (UFW), sin tocar Docker:
#
#   ufw deny 32770
#
# Opción C — iptables directo:
#
#   iptables -I INPUT -p tcp --dport 32770 ! -s 127.0.0.1 -j DROP
#
# ============================================================
# PASO 4: Arrancar el proxy
# ============================================================
#
#   cd /root/persiana-app
#   NOCODB_TOKEN=dZMS2te8v6cf47Jlmlnk3S3ft9LT_QO8bjNdOcZZ node proxy.js &
#
#   (o con PM2 para que quede corriendo siempre):
#   npm install -g pm2
#   NOCODB_TOKEN=xxx pm2 start proxy.js --name persiana-proxy
#   pm2 save
#   pm2 startup
#
# ============================================================
# PASO 5 (opcional): Bloquear dominio público de NocoDB
# ============================================================
#
# Si NocoDB tiene un dominio (nocodb.srv1323649.hstgr.cloud),
# revocar o redirigir ese dominio para que no exponga la API.
# La única ruta válida hacia NocoDB pasa ahora por el proxy.
#
# ============================================================
